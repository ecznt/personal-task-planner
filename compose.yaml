name: personal-task-planner

services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_task_planner
      POSTGRES_PASSWORD: planner_dev
      POSTGRES_USER: planner
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner -d personal_task_planner']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - planner_postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  planner_postgres_data:
