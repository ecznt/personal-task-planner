packages:
  - apps/*
  - packages/*

engineStrict: true
confirmModulesPurge: false
saveExact: true
strictPeerDependencies: true

overrides:
  '@angular-devkit/core>ajv': 8.20.0
  brace-expansion: 5.0.8
  find-my-way: 9.7.0
  js-yaml: 4.3.0
  picomatch: 4.0.5
  postcss: 8.5.22
  sharp: 0.35.3
  valibot: 1.4.2

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: false

patchedDependencies:
  brace-expansion@5.0.8: patches/brace-expansion@5.0.8.patch
