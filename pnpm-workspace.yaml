  brace-expansion: 5.0.9
  deepmerge-ts: '>=8.0.0'
  fast-uri: 3.1.6
  find-my-way: 9.7.0
  js-yaml: 4.3.1
  mysql2: '>=3.22.0'
  nanoid: 3.3.18
  picomatch: 4.0.5
  postcss: 8.5.22
  sharp: 0.35.3
  'undici@7': 7.29.0
  'undici@8': 8.9.0
  valibot: 1.4.2

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false

patchedDependencies:
