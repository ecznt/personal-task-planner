name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: personal_task_planner_test
          POSTGRES_PASSWORD: planner_test
          POSTGRES_USER: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d personal_task_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.4
        ports:
          - 1025:1025
    env:
      AUTH_SECURITY_KEY: ci-only-auth-security-key-32-characters
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgresql://planner:planner_test@127.0.0.1:5432/personal_task_planner_test
      LOG_LEVEL: silent
      NODE_ENV: test
      PORT: '3001'
      PUBLIC_ORIGIN: http://127.0.0.1:3000
      SMTP_FROM: planner@example.test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      TRUST_PROXY_HOPS: '0'
      WORKER_LEASE_MS: '30000'
      WORKER_POLL_INTERVAL_MS: '1000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:workspace
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm verify:architecture
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:component
      - run: pnpm test:api
      - run: pnpm test:db
      - run: pnpm test:contract
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:security
